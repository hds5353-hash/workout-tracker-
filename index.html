<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="과부하 트래커" />
  <title>점진적 과부하 트래커 (주 4회)</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1c2942;
      --border: #2a3b5c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 110px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
    }

    .day-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .day-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .day-tab.active {
      background: var(--accent);
      color: #061220;
      border-color: var(--accent);
    }

    .day-tab small {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 1px;
    }

    main {
      padding: 14px 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .stat-val {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ex-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0;
    }

    .ex-meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .target-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--accent);
      white-space: nowrap;
    }

    .guide-box {
      font-size: 0.8rem;
      padding: 9px 11px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      color: #e2e8f0;
    }

    .guide-box.ready {
      background: rgba(34, 197, 94, 0.14);
      border-left-color: var(--accent-2);
      color: #dcfce7;
    }

    .sets-table {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 44px 1fr 1fr 34px;
      gap: 6px;
      align-items: center;
      background: var(--surface-2);
      padding: 6px 8px;
      border-radius: 10px;
    }

    .set-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 7px;
    }

    .input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      text-align: right;
    }

    .input-wrap span {
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: 4px;
    }

    .done-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .done-btn.done {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #052e16;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button.btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.btn-primary {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #052e16;
    }

    button.btn-outline {
      background: transparent;
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .cardio-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .cardio-check {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .cardio-check input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-2);
    }

    .footer-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .timer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      min-width: 64px;
    }

    .timer-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .timer-btns button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-btns button.active-t {
      background: var(--warn);
      border-color: var(--warn);
      color: #111827;
    }

    textarea.io-box {
      width: 100%;
      min-height: 90px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>점진적 과부하 트래커</h1>
      <span class="badge">주 4회 · 유산소 20분 고정</span>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>

  <main>
    <div class="summary-strip">
      <div class="stat-card">
        <div class="stat-label">오늘 총 볼륨</div>
        <div class="stat-val" id="totalVolume">0 kg</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">완료 세트</div>
        <div class="stat-val" id="doneSets">0 / 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">20분 유산소</div>
        <div class="stat-val" id="cardioStatus">미완료</div>
      </div>
    </div>

    <div id="exerciseList"></div>

    <div class="card">
      <div class="cardio-box">
        <label class="cardio-check">
          <input type="checkbox" id="cardioCheckbox" />
          <span>중강도 유산소 20분 완료</span>
        </label>
        <span class="ex-meta">인클라인/천국의 계단 (120~140bpm)</span>
      </div>
    </div>

    <div class="footer-tools">
      <button class="btn btn-outline" id="toggleBackupBtn">백업 / 복원</button>
      <button class="btn" id="clearDayChecksBtn">오늘 체크 초기화</button>
      <button class="btn" id="resetDefaultBtn">기본값 리셋</button>
    </div>

    <div class="card hidden" id="backupCard" style="margin-top:10px;">
      <div style="font-size:0.84rem; font-weight:700;">기록 백업 및 복원 (JSON)</div>
      <div class="ex-meta">기기 변경이나 브라우저 데이터 삭제 대비용입니다.</div>
      <div class="card-actions">
        <button class="btn btn-outline" id="exportBtn">데이터 내보내기</button>
        <button class="btn btn-primary" id="importBtn">붙여넣기 복원</button>
      </div>
      <textarea class="io-box" id="ioTextarea" placeholder="여기에 백업 데이터가 표시되거나, 복원할 JSON을 붙여넣으세요."></textarea>
    </div>
  </main>

  <div class="timer-bar">
    <div class="timer-display" id="timerDisplay">02:00</div>
    <div class="timer-btns">
      <button data-sec="60">1분</button>
      <button data-sec="120" class="active-t">2분</button>
      <button id="timerToggleBtn">시작</button>
      <button id="timerResetBtn">리셋</button>
    </div>
  </div>

            },

              minReps: 8,
              maxReps: 10,
              stepKg: -5,

              sets: [
                { w: 35, r: 9, done: false },

              sets: [
                { w: 30, r: 11, done: false },
                { w: 30, r: 10, done: false },
                { w: 30, r: 10, done: false }
              ]
            },
            {
              id: "f3",
              name: "로우 케이블 플라이",
              type: "isolation",
              minReps: 12,
              maxReps: 15,
              stepKg: 2.5,
              unit: "kg",
              restNote: "최하단 도르래 · 휴식 1분",
              sets: [
                { w: 5, r: 14, done: false },
                { w: 5, r: 13, done: false }
              ]
            },
            {
              id: "f4",
              name: "등·후면 보조 (랫풀다운/로우)",
              type: "compound",
              minReps: 10,
              maxReps: 12,
              stepKg: 2.5,
              unit: "kg",
              restNote: "휴식 1.5분",
              sets: [
                { w: 35, r: 11, done: false },
                { w: 35, r: 10, done: false },
                { w: 35, r: 10, done: false }
              ]
            }
          ]
        }
      }
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_DATA);
        return JSON.parse(raw);
      } catch (e) {
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function evaluateProgression(ex) {
      const topTwoHit =
        ex.sets.length >= 2 &&
        Number(ex.sets[0].r) >= ex.maxReps &&
        Number(ex.sets[1].r) >= ex.maxReps;

      if (ex.type === "assist") {
        const nextAssist = Math.max(0, Number(ex.sets[0].w) + ex.stepKg);
        if (topTwoHit) {
          return {
            ready: true,
            msg: `증량 신호! 첫 2세트 ${ex.maxReps}회 달성 → 다음엔 보조 ${nextAssist}kg로 줄이고 7~8회부터 다시 시작하세요.`,
            nextW: nextAssist,
            nextR: 7
          };
        }
        return {
          ready: false,
          msg: `현재 보조 ${ex.sets[0].w}kg 유지 · 첫 2세트 ${ex.maxReps}회 채우면 보조 -5kg 진행`,
          nextW: ex.sets[0].w,
          nextR: ex.minReps
        };
      }

      const nextW = Number(ex.sets[0].w) + ex.stepKg;
      const resetReps = ex.type === "isolation" ? 10 : Math.max(6, ex.minReps - 1);

      if (topTwoHit) {
        return {
          ready: true,
          msg: `증량 신호! 첫 2세트 ${ex.maxReps}회 달성 → 다음엔 ${nextW}kg로 올리고 ${resetReps}회부터 다시 쌓으세요.`,
          nextW,
          nextR: resetReps
        };
      }

      const totalReps = ex.sets.reduce((acc, s) => acc + (Number(s.r) || 0), 0);
      return {
        ready: false,
        msg: `목표 ${ex.minReps}~${ex.maxReps}회 · 총 ${totalReps}회 수행 (첫 2세트 ${ex.maxReps}회 달성 시 +${ex.stepKg}kg)`,
        nextW,
        nextR: resetReps
      };
    }

    function render() {
      const dayKey = state.activeDay;
      const day = state.days[dayKey];

      // Tabs
      const tabsEl = document.getElementById("dayTabs");
      tabsEl.innerHTML = "";
      Object.entries(state.days).forEach(([k, d]) => {
        const btn = document.createElement("button");
        btn.className = "day-tab" + (k === dayKey ? " active" : "");
        btn.innerHTML = `${d.label}요일<small>${d.sub}</small>`;
        btn.onclick = () => {
          state.activeDay = k;
          saveState();
          render();
        };
        tabsEl.appendChild(btn);
      });

      // Summary
      let vol = 0;
      let totalSets = 0;
      let doneSets = 0;
      day.exercises.forEach((ex) => {
        ex.sets.forEach((s) => {
          totalSets++;
          if (s.done) doneSets++;
          if (ex.type !== "assist") {
            vol += (Number(s.w) || 0) * (Number(s.r) || 0);
          }
        });
      });

      document.getElementById("totalVolume").textContent = `${Math.round(vol).toLocaleString()} kg`;
      document.getElementById("doneSets").textContent = `${doneSets} / ${totalSets}`;
      document.getElementById("cardioStatus").textContent = day.cardioDone ? "완료 (20분)" : "미완료";
      document.getElementById("cardioCheckbox").checked = !!day.cardioDone;

      // Exercises
      const listEl = document.getElementById("exerciseList");
      listEl.innerHTML = "";

      day.exercises.forEach((ex, exIdx) => {
        const prog = evaluateProgression(ex);
        const card = document.createElement("div");
        card.className = "card";

        const setsHtml = ex.sets
          .map(
            (s, sIdx) => `
          <div class="set-row">
            <div class="set-num">${sIdx + 1}세트</div>
            <div class="input-wrap">
              <input type="number" step="0.5" value="${s.w}" data-ex="${exIdx}" data-s="${sIdx}" data-f="w" />
              <span>${ex.type === "assist" ? "보조kg" : "kg"}</span>
            </div>
            <div class="input-wrap">
              <input type="number" step="1" value="${s.r}" data-ex="${exIdx}" data-s="${sIdx}" data-f="r" />
              <span>회</span>
            </div>
            <button class="done-btn ${s.done ? "done" : ""}" data-ex="${exIdx}" data-s="${sIdx}" title="세트 완료">✓</button>
          </div>
        `
          )
          .join("");

        card.innerHTML = `
          <div class="card-head">
            <div>
              <h3 class="ex-title">${ex.name}</h3>
              <div class="ex-meta">${ex.sets.length}세트 · ${ex.restNote}</div>
            </div>
            <span class="target-pill">목표 ${ex.minReps}~${ex.maxReps}회</span>
          </div>
          <div class="guide-box ${prog.ready ? "ready" : ""}">${prog.msg}</div>
          <div class="sets-table">${setsHtml}</div>
          <div class="card-actions">
            ${
              prog.ready
                ? `<button class="btn btn-primary" data-apply="${exIdx}">다음 중량(${prog.nextW}kg) 적용</button>`
                : ""
            }
            <button class="btn" data-addset="${exIdx}">+ 세트 추가</button>
            ${ex.sets.length > 1 ? `<button class="btn" data-delset="${exIdx}">- 세트 삭제</button>` : ""}
          </div>
        `;
        listEl.appendChild(card);
      });

      // Bind inputs
      listEl.querySelectorAll("input[type='number']").forEach((inp) => {
        inp.addEventListener("change", (e) => {
          const exIdx = Number(e.target.dataset.ex);
          const sIdx = Number(e.target.dataset.s);
          const field = e.target.dataset.f;
          state.days[dayKey].exercises[exIdx].sets[sIdx][field] = Number(e.target.value) || 0;
          saveState();
          render();
        });
      });

      // Bind done buttons
      listEl.querySelectorAll(".done-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const exIdx = Number(e.target.dataset.ex);
          const sIdx = Number(e.target.dataset.s);
          const cur = state.days[dayKey].exercises[exIdx].sets[sIdx].done;
          state.days[dayKey].exercises[exIdx].sets[sIdx].done = !cur;
          saveState();
          render();
        });
      });

      // Bind apply progression
      listEl.querySelectorAll("[data-apply]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const exIdx = Number(e.target.dataset.apply);
          const ex = state.days[dayKey].exercises[exIdx];
          const prog = evaluateProgression(ex);
          ex.sets = ex.sets.map((s) => ({
            w: prog.nextW,
            r: prog.nextR,
            done: false
          }));
          saveState();
          render();
        });
      });

      // Bind add/del set
      listEl.querySelectorAll("[data-addset]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const exIdx = Number(e.target.dataset.addset);
          const ex = state.days[dayKey].exercises[exIdx];
          const last = ex.sets[ex.sets.length - 1] || { w: 20, r: ex.minReps, done: false };
          ex.sets.push({ w: last.w, r: last.r, done: false });
          saveState();
          render();
        });
      });

      listEl.querySelectorAll("[data-delset]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const exIdx = Number(e.target.dataset.delset);
          state.days[dayKey].exercises[exIdx].sets.pop();
          saveState();
          render();
        });
      });
    }

    document.getElementById("cardioCheckbox").addEventListener("change", (e) => {
      state.days[state.activeDay].cardioDone = e.target.checked;
      saveState();
      render();
    });

    document.getElementById("clearDayChecksBtn").addEventListener("click", () => {
      const d = state.days[state.activeDay];
      d.cardioDone = false;
      d.exercises.forEach((ex) => ex.sets.forEach((s) => (s.done = false)));
      saveState();
      render();
    });

    document.getElementById("resetDefaultBtn").addEventListener("click", () => {
      if (confirm("기본 루틴과 중량으로 초기화할까요? 현재 입력한 기록이 덮어씌워집니다.")) {
        state = structuredClone(DEFAULT_DATA);
        saveState();
        render();
      }
    });

    document.getElementById("toggleBackupBtn").addEventListener("click", () => {
      document.getElementById("backupCard").classList.toggle("hidden");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      document.getElementById("ioTextarea").value = JSON.stringify(state, null, 2);
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      try {
        const parsed = JSON.parse(document.getElementById("ioTextarea").value);
        if (parsed && parsed.days) {
          state = parsed;
          saveState();
          render();
          alert("기록이 복원되었습니다.");
        }
      } catch (err) {
        alert("올바른 JSON 형식이 아닙니다.");
      }
    });

    // Rest Timer
    let presetSec = 120;
    let remainingSec = 120;
    let timerId = null;

    function updateTimerText() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, "0");
      const s = String(remainingSec % 60).padStart(2, "0");
      document.getElementById("timerDisplay").textContent = `${m}:${s}`;
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, 350);
      } catch (e) {}
    }

    document.querySelectorAll(".timer-btns button[data-sec]").forEach((b) => {
      b.addEventListener("click", () => {
        clearInterval(timerId);
        timerId = null;
        document.getElementById("timerToggleBtn").textContent = "시작";
        document.querySelectorAll(".timer-btns button[data-sec]").forEach((x) => x.classList.remove("active-t"));
        b.classList.add("active-t");
        presetSec = Number(b.dataset.sec);
        remainingSec = presetSec;
        updateTimerText();
      });
    });

    document.getElementById("timerToggleBtn").addEventListener("click", (e) => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        e.target.textContent = "시작";
      } else {
        if (remainingSec <= 0) remainingSec = presetSec;
        e.target.textContent = "일시정지";
        timerId = setInterval(() => {
          remainingSec--;
          updateTimerText();
          if (remainingSec <= 0) {
            clearInterval(timerId);
            timerId = null;
            remainingSec = 0;
            updateTimerText();
            e.target.textContent = "시작";
            beep();
          }
        }, 1000);
      }
    });

    document.getElementById("timerResetBtn").addEventListener("click", () => {
      clearInterval(timerId);
      timerId = null;
      remainingSec = presetSec;
      updateTimerText();
      document.getElementById("timerToggleBtn").textContent = "시작";
    });

    updateTimerText();
    render();
  </script>
</body>
</html>
