<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>점진적 과부하 트래커</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-2: #202530;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --border: #2b303c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 88px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 21, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 6px 9px;
      font-size: 11px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    main {
      padding: 14px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .stat-sub {
      font-size: 11px;
      color: #93c5fd;
      margin-top: 3px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ex-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card-2);
      color: var(--muted);
    }

    .badge.overload {
      background: var(--green-soft);
      color: #6ee7b7;
    }

    .badge.hold {
      background: var(--amber-soft);
      color: #fcd34d;
    }

    .sets-grid {
      display: grid;
      gap: 8px;
    }

    .set-block {
      background: var(--card-2);
      padding: 8px;
      border-radius: 10px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 50px 1fr 1fr 34px;
      gap: 8px;
      align-items: center;
    }

    .set-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
    }

    .input-wrap span {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    input, select {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      padding: 7px 0;
      outline: none;
    }

    select option {
      background: var(--card);
      color: var(--text);
    }

    .rep-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 7px;
      padding-left: 58px;
    }

    .rep-chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 7px;
      padding: 5px 0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .rep-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .check-btn.done {
      background: var(--green);
      border-color: var(--green);
      color: #06281e;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .form-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .form-box label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .form-box input, .form-box select {
      padding: 4px 0;
      font-size: 13px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.45;
    }

    .timer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #141820;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 30;
    }

    .timer-time {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div>
        <h1>점진적 과부하 트래커</h1>
        <div class="sub" id="daySummary">주 4회 루틴 · 인클라인 트레드밀 20분</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn" onclick="togglePanel()">체형·유산소</button>
        <button class="btn" onclick="resetDefaults()">초기화</button>
      </div>
    </div>
    <div class="tabs" id="dayTabs"></div>
  </header>

  <main id="app"></main>

  <div class="timer-bar">
    <div>
      <div style="font-size:11px; color:var(--muted);">휴식 타이머</div>
      <div class="timer-time" id="timerDisplay">02:00</div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn" onclick="setTimer(60)">1분</button>
      <button class="btn" onclick="setTimer(90)">1분30초</button>
      <button class="btn" onclick="setTimer(120)">2분</button>
      <button class="btn btn-primary" id="timerToggleBtn" onclick="toggleTimer()">시작</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "progressive_overload_tracker_v6";
    const DAYS = ["월", "화", "목", "금"];
    const REP_CHOICES = [8, 10, 12, 15, 20];
    const DAY_NAMES = {
      "월": "월요일 (가슴·삼두)",
      "화": "화요일 (하체·어깨)",
      "목": "목요일 (등·이두)",
      "금": "금요일 (가슴 상부·보조)"
    };

    const DEFAULT_ROUTINE = {
      "월": [
        { id: "mon-bench", name: "바벨 벤치프레스", type: "compound", targetReps: 10, stepKg: 2.5, defaultWeight: 60, sets: 4, restSec: 120 },
        { id: "mon-fly", name: "케이블 플라이", type: "isolation", targetReps: 12, stepKg: 1.5, defaultWeight: 10, sets: 3, restSec: 90 }
      ],
      "화": [
        { id: "tue-squat", name: "바벨 스쿼트", type: "compound", targetReps: 10, stepKg: 5, defaultWeight: 70, sets: 4, restSec: 120 },
        { id: "tue-rdl", name: "루마니안 데드리프트", type: "compound", targetReps: 10, stepKg: 5, defaultWeight: 60, sets: 3, restSec: 120 },
        { id: "tue-slr", name: "사이드 레터럴 레이즈", type: "isolation", targetReps: 15, stepKg: 1, defaultWeight: 6, sets: 4, restSec: 75 }
      ],
      "목": [
        { id: "thu-row", name: "바벨 로우 / 시티드 로우", type: "compound", targetReps: 10, stepKg: 2.5, defaultWeight: 50, sets: 3, restSec: 120 },
        { id: "thu-curl", name: "이지바 바벨컬", type: "isolation", targetReps: 12, stepKg: 2.5, defaultWeight: 25, sets: 3, restSec: 90 }
      ],
      "금": [
        { id: "fri-db-bench", name: "덤벨 벤치프레스", type: "compound", targetReps: 10, stepKg: 2, defaultWeight: 14, sets: 4, restSec: 120 },
        { id: "fri-inc-smith", name: "인클라인 스미스 프레스", type: "compound", targetReps: 10, stepKg: 2.5, defaultWeight: 40, sets: 3, restSec: 120 },
        { id: "fri-low-fly", name: "로우 케이블 플라이", type: "isolation", targetReps: 12, stepKg: 1.5, defaultWeight: 7.5, sets: 2, restSec: 60 }
      ]
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        activeDay: "월",
        showPanel: true,
        body: {
          weightKg: 70,
          skeletalMuscleKg: 33,
          bodyFatKg: 12
        },
        cardio: {
          mode: "steady_incline",
          inclinePct: 8,
          minutes: 20,
          liftingMinutes: 55,
          highSec: 30,
          lowSec: 30,
          rounds: 15
        },
        routine: structuredClone(DEFAULT_ROUTINE),
        logs: {}
      };
    }

    let state = loadState();
    let timerSec = 120;
    let timerInterval = null;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function togglePanel() {
      state.showPanel = !state.showPanel;
      saveState();
      render();
    }

    function updateBody(field, val) {
      state.body[field] = Math.max(0, parseFloat(val) || 0);
      saveState();
      render();
    }

    function updateCardio(field, val) {
      if (field === "mode") {
        state.cardio.mode = val;
      } else {
        state.cardio[field] = Math.max(0, parseFloat(val) || 0);
      }
      saveState();
      render();
    }

    function getExerciseLogs(day, ex) {
      const key = `${day}_${ex.id}`;
      if (!state.logs[key]) {
        state.logs[key] = Array.from({ length: ex.sets }, () => ({
          weight: ex.defaultWeight,
          reps: ex.targetReps,
          done: false
        }));
      }
      return state.logs[key];
    }

    function calcTotalVolume(day) {
      const list = state.routine[day] || [];
      let checkedVolume = 0;
      let plannedVolume = 0;
      let checkedSets = 0;
      let totalSets = 0;

      for (const ex of list) {
        const rows = getExerciseLogs(day, ex);
        for (const r of rows) {
          const w = Number(r.weight) || 0;
          const reps = Number(r.reps) || 0;
          const vol = w * reps;
          plannedVolume += vol;
          totalSets += 1;
          if (r.done) {
            checkedVolume += vol;
            checkedSets += 1;
          }
        }
      }

      return {
        volume: checkedSets > 0 ? checkedVolume : plannedVolume,
        checkedVolume,
        plannedVolume,
        checkedSets,
        totalSets
      };
    }

    function calcEstimatedCalories(volInfo) {
      const wKg = Math.max(35, Number(state.body.weightKg) || 70);
      const smmKg = Math.max(0, Number(state.body.skeletalMuscleKg) || 0);
      const fatKg = Math.max(0, Number(state.body.bodyFatKg) || 0);

      let ffmRatio = 1.0;
      if (smmKg > 0 && wKg > 0) {
        const estFfm = Math.min(wKg, smmKg * 1.28);
        ffmRatio = Math.min(1.15, Math.max(0.9, 0.88 + (estFfm / wKg) * 0.16));
      } else if (fatKg > 0 && wKg > fatKg) {
        const leanRatio = (wKg - fatKg) / wKg;
        ffmRatio = Math.min(1.15, Math.max(0.9, 0.85 + leanRatio * 0.2));
      }

      const incline = Math.max(0
