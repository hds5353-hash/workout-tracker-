<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>점진적 과부하 트래커</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-2: #202530;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --border: #2b303c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 6px 9px;
      font-size: 11px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    main {
      padding: 14px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ex-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--card-2);
      color: var(--muted);
    }

    .badge.overload {
      background: var(--green-soft);
      color: #6ee7b7;
    }

    .badge.hold {
      background: var(--amber-soft);
      color: #fcd34d;
    }

    .sets-grid {
      display: grid;
      gap: 8px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 54px 1fr 1fr 34px;
      gap: 8px;
      align-items: center;
      background: var(--card-2);
      padding: 8px;
      border-radius: 10px;
    }

    .set-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
    }

    .input-wrap span {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    input, select {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      padding: 8px 0;
      outline: none;
    }

    select option {
      background: var(--card);
      color: var(--text);
    }

    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .check-btn.done {
      background: var(--green);
      border-color: var(--green);
      color: #06281e;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .form-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
